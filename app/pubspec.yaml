name: flyprox_app
description: Flyprox - a name-based quiz game
publish_to: 'none'
version: 1.0.3+15

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^17.5.0

  # State management
  flutter_riverpod: ^3.5.0

  # Network
  dio: ^5.4.3

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^10.3.4

  # UI
  pinput: ^6.0.2
  permission_handler: ^12.0.3

  # Phone input
  intl_phone_field: ^3.2.0

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.5

  # Crypto (for contacts hashing)
  crypto: ^3.0.3

  # In-app purchases: Superwall owns billing end to end.
  superwallkit_flutter: ^2.8.0

  # URL launcher
  url_launcher: ^6.3.0

  share_plus: ^12.0.2
  video_player: ^2.14.1
  flutter_native_contact_picker: 0.0.13
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  phone_numbers_parser: ^9.0.29
  firebase_messaging: ^17.1.0
  app_links: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  flutter_secure_storage_platform_interface: ^2.1.1

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/reward.wav
    - assets/images/flyprox-logo.png
    - assets/animations/flyprox-intro.mp4
    - assets/fonts/phosphor/LICENSE.txt

  fonts:
    - family: FlyproxNavRegular
      fonts:
        - asset: assets/fonts/phosphor/flyprox-nav-regular.ttf
    - family: FlyproxNavFill
      fonts:
        - asset: assets/fonts/phosphor/flyprox-nav-fill.ttf

  generate: true
